name: publish-firmware

# release-please tags the release with a GitHub App token, so this tag push
# triggers here directly. Keyed to the tag, so re-running after a transient
# failure just rebuilds and re-uploads (gh release upload --clobber).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32-s3, esp32dev, esp32-c3, esp32-s2, lolin_s2_mini]
    steps:
      - uses: actions/checkout@v7 # checks out the tagged commit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Attach firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="esp-visca-proxy-${{ matrix.env }}.bin"
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "$bin"
          gh release upload "${{ github.ref_name }}" "$bin" --clobber
