; PlatformIO project — ESP VISCA Proxy
; Bridges Sony VISCA-over-IP (UDP 52381) to an RS232 PTZ camera.

[platformio]
default_envs = esp32-s3
description = VISCA-over-IP to RS232 proxy for ESP32

[env]
; pioarduino fork — provides Arduino-ESP32 core 3.x (ESP-IDF 5.x), which is what
; gives W5500-over-SPI Ethernet integrated with lwIP (ETH_PHY_W5500 / Network).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DCORE_DEBUG_LEVEL=3
extra_scripts = pre:scripts/embed_assets.py
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.7.0
    esp32async/AsyncTCP @ ^3.4.0
    bblanchon/ArduinoJson @ ^7.4.1
    ayushsharma82/ElegantOTA @ ^3.1.7

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_CLASSIC

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_C3

[env:esp32-s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S2

; Wemos/Lolin S2 Mini — onboard LED on GPIO15 (LED_BUILTIN), unlike the saola
; RGB devkit. Use this env for that board so the status LED works out of the box.
[env:lolin_s2_mini]
board = lolin_s2_mini
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S2
